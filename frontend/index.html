<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Matriz SGR</title>
    <script>
      // Anti-parpadeo de tema: aplicar data-theme ANTES del primer paint.
      (function () {
        try {
          var guardado = localStorage.getItem("matriz.tema");
          var oscuro =
            guardado ? guardado === "oscuro" : window.matchMedia("(prefers-color-scheme: dark)").matches;
          if (oscuro) document.documentElement.dataset.theme = "oscuro";
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
