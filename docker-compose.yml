# Compose de DESARROLLO: solo la base de datos.
# Backend y frontend corren con npm run dev (hot reload).
# El compose de producción (backend+frontend+caddy) vive en /infra (Fase 5).
services:
  postgres:
    image: postgres:16-alpine
    container_name: matriz-sgr-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-matriz}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-matriz_dev_local}
      POSTGRES_DB: ${POSTGRES_DB:-matriz_sgr}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - matriz_sgr_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-matriz} -d ${POSTGRES_DB:-matriz_sgr}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  matriz_sgr_pgdata:
